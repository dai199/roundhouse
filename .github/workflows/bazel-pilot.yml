name: Bazel pilot

# Pilot for #273: build roundhouse, emit the blog to Rust, and run that
# project's tests under Bazel, with BuildBuddy as the remote cache. A test
# whose emitted project is byte-identical to a cached run is not re-run.
on:
  push:
    branches: [bazel-pilot]
  pull_request:
    branches: [bazel-pilot]

concurrency:
  group: bazel-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # The remote executors' images, published to GHCR for BuildBuddy to pull.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the tag bazel/images.bzl names
        run: |
          image=$(sed -n 's|^CI_IMAGE = "docker://\(.*\)"|\1|p' bazel/images.bzl)
          if docker manifest inspect "$image" >/dev/null 2>&1; then echo "$image exists"; exit 0; fi
          docker build -t "$image" bazel/images/all
          docker push "$image"

  all-rbe:
    # Pilot: every lane as Bazel tests, executed on BuildBuddy; this job only orchestrates.
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Generate fixtures (real-blog, store) the source-tree suites read
        run: |
          gem install rails --no-document
          bin/rh fixture
          (cd fixtures && ../scripts/create-store store)
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: bazel test --config=rbe //:all
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          set +e
          bazel test --config=rbe "--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" --keep_going \
            --test_output=errors --jobs=80 \
            --define=SPINEL_SHA="$(git ls-remote https://github.com/matz/spinel refs/heads/master | cut -f1)" \
            //:all 2>&1 | tee bazel-all.log
          status=${PIPESTATUS[0]}
          grep -E 'INFO: [0-9]+ processes|Executed [0-9]+ out of|Elapsed time' bazel-all.log >> "$GITHUB_STEP_SUMMARY"
          grep -E '^//:.* (FAILED|NO STATUS|FAILED TO BUILD|TIMEOUT)' bazel-all.log >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
