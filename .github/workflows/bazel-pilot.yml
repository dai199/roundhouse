name: Bazel pilot

# Pilot for #273: build roundhouse, emit the blog to Rust, and run that
# project's tests under Bazel, with BuildBuddy as the remote cache. A test
# whose emitted project is byte-identical to a cached run is not re-run.
on:
  push:
    branches: [bazel-pilot]
  pull_request:
    branches: [bazel-pilot]

concurrency:
  group: bazel-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  images:
    # The remote executors' images, published to GHCR for BuildBuddy to pull.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push the tags bazel/images.bzl names
        run: |
          build() {
            image=$(sed -n "s|^$1 = \"docker://\\(.*\\)\"|\\1|p" bazel/images.bzl)
            if docker manifest inspect "$image" >/dev/null 2>&1; then echo "$image exists"; return; fi
            docker build -t "$image" -f "$2" .
            docker push "$image"
          }
          build CI_IMAGE bazel/images/all/Dockerfile
          build DIND_IMAGE bazel/images/dind/Dockerfile

  all-rbe:
    # Pilot: every lane as Bazel tests, executed on BuildBuddy; this job only orchestrates.
    if: github.event_name == 'push'
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Fixtures (real-blog, store) the source-tree suites read
        # Not `bin/rh fixture` here: each run's fresh `rails new` differs in bytes, and every test reading it would miss the cache.
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          bazel build --config=rbe "--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" --remote_download_toplevel \
            //:real_blog_fixture //:store_fixture
          mkdir -p fixtures/real-blog fixtures/store
          tar -xf bazel-bin/real-blog-fixture.tar -C fixtures/real-blog
          tar -xf bazel-bin/store-fixture.tar -C fixtures/store
      - name: bazel test --config=rbe //:all
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          set +e
          bazel test --config=rbe "--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" --keep_going \
            --test_output=errors --jobs=80 --build_tests_only \
            --define=SPINEL_SHA="$(git ls-remote https://github.com/matz/spinel refs/heads/master | cut -f1)" \
            //:all 2>&1 | tee bazel-all.log
          status=${PIPESTATUS[0]}
          grep -E 'INFO: [0-9]+ processes|Executed [0-9]+ out of|Elapsed time' bazel-all.log >> "$GITHUB_STEP_SUMMARY"
          grep -E '^//:.* (FAILED|NO STATUS|FAILED TO BUILD|TIMEOUT)' bazel-all.log >> "$GITHUB_STEP_SUMMARY" || true
          [ "$status" -eq 0 ] && exit 0
          # ci.yml's continue-on-error jobs: a failure tagged advisory is reported, not gating.
          bazel query 'attr(tags, "\badvisory\b", tests(//:all))' 2>/dev/null | sort > advisory.txt
          grep -oE '^//:[^ ]+ +(FAILED|NO STATUS|FAILED TO BUILD|TIMEOUT)' bazel-all.log | cut -d' ' -f1 | sort -u > failed.txt
          [ -s failed.txt ] || exit $status
          gating=$(comm -23 failed.txt advisory.txt)
          for t in $(comm -12 failed.txt advisory.txt); do echo "::warning::advisory lane failed: $t"; done
          [ -z "$gating" ] || { echo "$gating"; exit 1; }
