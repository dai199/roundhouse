name: Bazel pilot

# Pilot for #273: build roundhouse, emit the blog to Rust, and run that
# project's tests under Bazel, with BuildBuddy as the remote cache. A test
# whose emitted project is byte-identical to a cached run is not re-run.
on:
  push:
    branches: [bazel-pilot]
  pull_request:
    branches: [bazel-pilot]

concurrency:
  group: bazel-pilot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  blog-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Generate fixtures/real-blog
        run: |
          gem install rails --no-document
          bin/rh fixture
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.1'
      - name: Install libsqlite3-dev (Swift CSQLite systemLibrary)
        run: '"$GITHUB_WORKSPACE/scripts/ci-apt-install" libsqlite3-dev'
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: bazel test (rust, kotlin, swift)
        env:
          BUILDBUDDY_API_KEY: ${{ github.event_name == 'push' && secrets.BUILDBUDDY_ORG_API_KEY || '' }}
          BUILDBUDDY_READONLY_API_KEY: ${{ vars.BUILDBUDDY_READONLY_API_KEY || secrets.BUILDBUDDY_READONLY_API_KEY }}
        run: |
          # Not a hard requirement: a fork PR has no secrets, so it runs without the remote cache.
          # Not the job PATH: the Swift toolchain leads it, and the C toolchain autoconfiguration then resolves a linker that is not there.
          flags=(--repo_env=PATH=/usr/local/bin:/usr/bin:/bin --config=local)
          # Not the write key on a pull request: a fork's pull request has none, so every PR reads only.
          if [ -n "$BUILDBUDDY_API_KEY" ]; then
            flags+=(--config=bb "--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY")
          elif [ -n "$BUILDBUDDY_READONLY_API_KEY" ]; then
            flags+=(--config=bb-ro "--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_READONLY_API_KEY")
          fi
          bazel test --test_output=errors "${flags[@]}" //:blog_rust_test //:blog_kotlin_test //:blog_swift_test //:compare_rust_test 2>&1 | tee bazel-test.log
          grep -E '^//:' bazel-test.log >> "$GITHUB_STEP_SUMMARY"

  roundhouse-rbe:
    # Pilot: the roundhouse build itself executed on BuildBuddy's machines.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: bazel build --config=rbe //:roundhouse
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          bazel build --config=rbe "--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" //:roundhouse 2>&1 | tee bazel-rbe.log
          grep -E 'INFO: [0-9]+ processes|Elapsed time|Critical Path' bazel-rbe.log >> "$GITHUB_STEP_SUMMARY"

  blog-rbe:
    # Pilot: the blog lanes on BuildBuddy end to end — the fixture is generated there too.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: bazel test --config=rbe (blog lanes, forced to run)
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          bazel test --config=rbe "--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" --nocache_test_results \
            //:blog_rust_test //:blog_kotlin_test //:blog_swift_test //:compare_rust_test 2>&1 | tee bazel-rbe-test.log
          grep -E '^//:|INFO: [0-9]+ processes' bazel-rbe-test.log >> "$GITHUB_STEP_SUMMARY"

  unit-rbe:
    # Pilot: the whole `cargo test` suite as Bazel tests, executed on BuildBuddy.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Generate fixtures (real-blog, store)
        run: |
          gem install rails --no-document
          bin/rh fixture
          (cd fixtures && ../scripts/create-store store)
      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: bazel test --config=rbe (unit suites)
        env:
          BUILDBUDDY_API_KEY: ${{ secrets.BUILDBUDDY_ORG_API_KEY }}
        run: |
          set +e
          bazel test --config=rbe "--remote_header=x-buildbuddy-api-key=$BUILDBUDDY_API_KEY" --keep_going \
            --test_output=errors --test_tag_filters=unit //:all 2>&1 | tee bazel-unit.log
          status=${PIPESTATUS[0]}
          grep -E 'INFO: [0-9]+ processes|Executed [0-9]+ out of' bazel-unit.log >> "$GITHUB_STEP_SUMMARY"
          grep -E '^//:.* (FAILED|NO STATUS|FAILED TO BUILD)' bazel-unit.log >> "$GITHUB_STEP_SUMMARY" || true
          exit $status
