name: unit-prof
on:
  push:
    branches: [unit-prof]
permissions:
  contents: read
jobs:
  prof:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_PROFILE_TEST_SPLIT_DEBUGINFO: "off"
      RUST_MIN_STACK: "33554432"
      ROUNDHOUSE_TEST_BUNDLE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0.9"
      - name: Build all_tests
        run: |
          tar -xzf prof-fixtures/real-blog.tar.gz -C fixtures
          cargo test --no-run --test all_tests --message-format=json > build.json
          python3 -c 'import json; [print(m["executable"]) for m in map(json.loads, open("build.json")) if m.get("reason")=="compiler-artifact" and m.get("executable") and m["target"]["name"]=="all_tests"]' > bin.txt
          cat bin.txt
      - name: Alone, then four at a time
        run: |
          mkdir -p logs
          bin=$(cat bin.txt)
          $bin --list emit_and_run::relation_finders 2>/dev/null | grep ': test' | wc -l
          s=$(date +%s); RH_PHASE_LOG=$PWD/logs/one.log $bin emit_and_run::relation_finders --test-threads 1 > logs/one.out 2>&1 || true; echo "one: $(( $(date +%s)-s ))s"
          s=$(date +%s); RH_PHASE_LOG=$PWD/logs/four.log $bin emit_and_run::relation_finders --test-threads 4 > logs/four.out 2>&1 || true; echo "four: $(( $(date +%s)-s ))s"
          tail -3 logs/one.out
          for f in one four; do python3 - logs/$f.log <<'PY'
          import re, sys
          t = open(sys.argv[1]).read()
          e = re.findall(r"emit (\w+) materialize=([0-9.]+) ingest=([0-9.]+) analyze_lower=([0-9.]+) diagnose=([0-9.]+) target_files=([0-9.]+) write=([0-9.]+)", t)
          r = [float(x) for x in re.findall(r"ruby run=([0-9.]+)", t)]
          keys = ["materialize", "ingest", "analyze_lower", "diagnose", "target_files", "write"]
          print(sys.argv[1], len(e), {k: round(sum(float(x[i + 1]) for x in e) / max(len(e), 1), 3) for i, k in enumerate(keys)}, "ruby", round(sum(r) / max(len(r), 1), 3), len(r))
          PY
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: unit-prof
          path: logs
