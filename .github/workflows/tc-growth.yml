name: tc-growth
on:
  push:
    branches: [tc-growth]
permissions:
  contents: read
jobs:
  empty:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build roundhouse (main) and emit
        run: |
          git clone -q https://github.com/roundhouse-rb/roundhouse rh && git -C rh log -1 --oneline
          (cd rh && cargo build --release --bin roundhouse)
          mkdir -p out logs
          for a in empty bare; do rh/target/release/roundhouse --target spinel split-fixtures/$a -o out/$a > logs/emit-$a.log 2>&1; tail -2 logs/emit-$a.log; done
      - name: Spinel master
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp && git -C sp log -1 --oneline
          make -C sp deps >/dev/null && make -C sp all -j4 >/dev/null
          for a in empty bare; do
            ( cd out/$a && $GITHUB_WORKSPACE/sp/spinel main.rb -c -o /tmp/$a.c --force ) > logs/spinel-$a.log 2>&1; echo "$a exit=$?"; grep -v '^spinel-timing' logs/spinel-$a.log | tail -5
            l=$(grep -o 'main.rb:[0-9]*' logs/spinel-$a.log | head -1 | cut -d: -f2)
            [ -n "$l" ] && sed -n "$((l-15)),$((l+5))p" out/$a/main.rb
          done
          tar -czf logs/out.tgz out
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tc-growth-empty
          path: logs
