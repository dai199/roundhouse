name: tc-growth
on:
  push:
    branches: [tc-growth]
permissions:
  contents: read
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build roundhouse
        run: |
          git clone -q https://github.com/roundhouse-rb/roundhouse rh && git -C rh checkout -q 2961d6e559e6f4c783e235b11c980e25846cd325
          (cd rh && cargo build --release --bin roundhouse)
          mkdir -p out logs
          rh/target/release/roundhouse --target spinel split-fixtures/empty -o out/empty 2>&1 | tail -1
      - name: perf each Spinel
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev linux-tools-common linux-tools-$(uname -r) || sudo apt-get install -yq linux-tools-azure
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          git clone -q https://github.com/matz/spinel sp
          for V in d674b17a7 7561246a3; do
            git -C sp checkout -q $V && make -C sp deps >/dev/null && make -C sp all -j4 >/dev/null && git -C sp log -1 --oneline
            ( cd out/empty && perf record -F 499 -g -o /tmp/perf-$V.data $GITHUB_WORKSPACE/sp/spinel main.rb -c -o /tmp/e-$V.c --force --timing ) > logs/empty-$V.log 2>&1 || true
            grep -o 'phase=analysis ms=[0-9.]*' logs/empty-$V.log
            perf report -i /tmp/perf-$V.data --no-children --stdio --percent-limit 0.7 -g none 2>/dev/null | grep -v '^#' | grep -v '^$' | head -40 > logs/self-$V.txt
            perf report -i /tmp/perf-$V.data --children --stdio --percent-limit 2 -g none 2>/dev/null | grep -v '^#' | grep -v '^$' | head -60 > logs/children-$V.txt
            cat logs/self-$V.txt | head -25
          done
          cp sp/spinel logs/ 2>/dev/null || true
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tc-growth-perf
          path: logs
