name: tc-growth
on:
  push:
    branches: [tc-growth]
permissions:
  contents: read
jobs:
  rh-growth:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build both roundhouse revisions and emit
        run: |
          mkdir -p out logs
          tar -xzf split-fixtures/real-blog.tar.gz -C split-fixtures
          for R in b56de3091b8aba5293a89a656d07354cb5720e36 2961d6e559e6f4c783e235b11c980e25846cd325; do
            git clone -q https://github.com/roundhouse-rb/roundhouse rh-$R && git -C rh-$R checkout -q $R
            (cd rh-$R && cargo build --release --bin roundhouse 2>&1 | tail -1)
            rh-$R/target/release/roundhouse --target spinel split-fixtures/real-blog -o out/blog-${R:0:9} 2>&1 | tail -1
            echo "${R:0:9} rb lines: $(find out/blog-${R:0:9} -name '*.rb' | xargs cat | wc -l)"
          done
      - name: One Spinel, both outputs, alternating
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp && git -C sp checkout -q 63742e2bf && make -C sp deps >/dev/null && make -C sp all -j4 >/dev/null
          for i in 1 2 3; do for R in b56de3091 2961d6e55; do
            ( cd out/blog-$R && $GITHUB_WORKSPACE/sp/spinel main.rb -c -o /tmp/b-$R.c --force --timing ) > logs/blog-$R-$i.log 2>&1 || true
            echo "rh=$R #$i $(grep -o 'phase=analysis ms=[0-9.]*' logs/blog-$R-$i.log)"
          done; done | tee logs/apps.txt
          diff -rq out/blog-b56de3091 out/blog-2961d6e55 | head -40 | tee logs/tree-diff.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tc-growth-rh
          path: logs
