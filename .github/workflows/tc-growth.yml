name: tc-growth
on:
  push:
    branches: [tc-growth]
permissions:
  contents: read
jobs:
  empty:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        rh: [main, empty-routes]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 4.0.9
      - name: Build roundhouse and emit
        run: |
          git clone -q https://github.com/dai199/roundhouse rh
          if [ ${{ matrix.rh }} = main ]; then git -C rh fetch -q https://github.com/roundhouse-rb/roundhouse main && git -C rh checkout -q FETCH_HEAD; else git -C rh checkout -q empty-routes; fi
          git -C rh log -1 --oneline
          (cd rh && cargo build --release --bin roundhouse)
          mkdir -p out logs
          rh/target/release/roundhouse --target spinel split-fixtures/empty -o out/spinel 2>&1 | tail -1
          rh/target/release/roundhouse --target ruby split-fixtures/empty -o out/ruby 2>&1 | tail -1
      - name: CRuby
        run: |
          cd out/ruby
          ls; [ -f Gemfile ] && { bundle install --quiet 2>&1 | tail -3 || true; }
          echo "--- CGI GET /"
          REQUEST_METHOD=GET PATH_INFO=/ QUERY_STRING= HTTP_HOST=localhost timeout 60 bundle exec ruby main.rb 2>&1 | head -12 || echo "cgi exit=$?"
          echo "--- rackup GET / and /widgets"
          (timeout 90 bundle exec rackup -p 4567 -o 127.0.0.1 > /tmp/rack.log 2>&1 &)
          for i in $(seq 1 40); do curl -s -o /dev/null 127.0.0.1:4567/ && break; sleep 1; done
          for p in / /widgets; do echo "GET $p -> $(curl -s -o /tmp/body -w '%{http_code}' 127.0.0.1:4567$p)"; head -c 200 /tmp/body; echo; done
          tail -15 /tmp/rack.log
      - name: Spinel native
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp && git -C sp log -1 --oneline
          make -C sp deps >/dev/null && make -C sp all -j4 >/dev/null
          cd out/spinel
          ( $GITHUB_WORKSPACE/sp/spinel main.rb -o app ) > ../../logs/spinel.log 2>&1 && echo "build ok" || { echo "build refused"; grep -v '^spinel-timing' ../../logs/spinel.log | tail -5; exit 0; }
          (timeout 60 ./app -p 4568 > /tmp/app.log 2>&1 &)
          for i in $(seq 1 30); do curl -s -o /dev/null 127.0.0.1:4568/ && break; sleep 1; done
          for p in / /widgets; do echo "GET $p -> $(curl -s -o /tmp/body -w '%{http_code}' 127.0.0.1:4568$p)"; head -c 200 /tmp/body; echo; done
          tail -10 /tmp/app.log
