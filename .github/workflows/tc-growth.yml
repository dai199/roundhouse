name: tc-growth
on:
  push:
    branches: [tc-growth]
permissions:
  contents: read
jobs:
  empty:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build roundhouse (main) and emit
        run: |
          git clone -q https://github.com/dai199/roundhouse rh && git -C rh checkout -q empty-routes && git -C rh log -1 --oneline
          (cd rh && cargo build --release --bin roundhouse)
          (cd rh && cargo test --release --test app_without_root_route 2>&1 | tail -8)
          mkdir -p out logs
          for a in empty bare; do rh/target/release/roundhouse --target spinel split-fixtures/$a -o out/$a > logs/emit-$a.log 2>&1; tail -2 logs/emit-$a.log; done
      - name: Spinel master
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp && git -C sp log -1 --oneline
          make -C sp deps >/dev/null && make -C sp all -j4 >/dev/null
          for a in empty bare; do
            ( cd out/$a && $GITHUB_WORKSPACE/sp/spinel main.rb -c -o /tmp/$a.c --force ) > logs/spinel-$a.log 2>&1 && echo "$a ok" || echo "$a refused"
            grep -v '^spinel-timing' logs/spinel-$a.log | tail -5 || true
          done
          tar -czf logs/out.tgz out
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tc-growth-empty
          path: logs
