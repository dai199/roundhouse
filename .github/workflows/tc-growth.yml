name: tc-growth
on:
  push:
    branches: [tc-growth]
permissions:
  contents: read
jobs:
  churn:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Emit at each main commit since 2026-11-13
        run: |
          git clone -q https://github.com/roundhouse-rb/roundhouse rh
          tar -xzf split-fixtures/real-blog.tar.gz -C split-fixtures
          mkdir -p logs
          git -C rh log --first-parent --format='%H %cI' --since=2026-11-13T00:00:00Z main | tac > logs/commits.txt
          wc -l logs/commits.txt
          while read sha at; do
            git -C rh checkout -q "$sha"
            if ! (cd rh && cargo build --release --bin roundhouse >/dev/null 2>&1); then echo "$sha $at build-failed" | tee -a logs/hashes.txt; continue; fi
            line="$sha $at"
            for a in real-blog empty; do
              rm -rf "/tmp/o-$a"
              rh/target/release/roundhouse --target spinel split-fixtures/$a -o /tmp/o-$a >/dev/null 2>&1 || true
              line="$line $a=$( (cd /tmp/o-$a && find . -type f -not -name '*.md' | LC_ALL=C sort | xargs sha256sum) | sha256sum | cut -c1-12)"
            done
            echo "$line" | tee -a logs/hashes.txt
          done < logs/commits.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: tc-growth-churn
          path: logs
