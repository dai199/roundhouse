name: tc-growth
on:
  push:
    branches: [tc-growth]
permissions:
  contents: read
jobs:
  diff:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: The two tests on base and branch
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev >/dev/null
          git clone -q https://github.com/matz/spinel sp
          git -C sp fetch -q https://github.com/dai199/spinel reopen-head-early:reopen-head-early
          B=$(git -C sp rev-parse reopen-head-early~1)
          for V in $B reopen-head-early; do
            git -C sp checkout -q $V && make -C sp deps >/dev/null && make -C sp all -j4 >/dev/null
            for t in test/obj_array_walk_method_tail.rb test/object_array_push_element_read.rb; do
              for i in 1 2; do (cd sp && timeout 120 ./spinel $t -S > /tmp/$(basename $t)-${V:0:7}-$i.out 2>&1; echo "exit=$?" >> /tmp/$(basename $t)-${V:0:7}-$i.out); done
              (cd sp && timeout 120 ./spinel $t -o /tmp/bin && /tmp/bin > /tmp/$(basename $t)-${V:0:7}.run 2>&1; echo "run exit=$?" >> /tmp/$(basename $t)-${V:0:7}.run)
            done
          done
          for t in obj_array_walk_method_tail.rb object_array_push_element_read.rb; do
            echo "=== $t base self-diff: $(diff /tmp/$t-${B:0:7}-1.out /tmp/$t-${B:0:7}-2.out | wc -l)"
            diff /tmp/$t-${B:0:7}-1.out /tmp/$t-reopen-1.out | head -60
            echo "--- run outputs"; diff /tmp/$t-${B:0:7}.run /tmp/$t-reopen.run && echo same run; cat /tmp/$t-reopen.run | head; echo "--- expected"; diff /tmp/$t-reopen.run <(cat sp/test/$t.expected 2>/dev/null; echo "run exit=0") && echo matches expected
          done
