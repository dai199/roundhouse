name: analysis-split
on:
  push:
    branches: [analysis-split]
permissions:
  contents: read
env:
  BRANCH: top-level-names
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build roundhouse (release)
        run: cargo build --release --bin roundhouse
      - name: Build Spinel branch (frame pointers)
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp
          git -C sp fetch -q https://github.com/dai199/spinel "$BRANCH" && git -C sp checkout -q FETCH_HEAD
          make -C sp deps >/dev/null && make -C sp all -j4 COPT="-O2 -g -fno-omit-frame-pointer" >/dev/null
          git -C sp log -1 --oneline
      - name: Emit
        run: |
          tar -xzf split-fixtures/real-blog.tar.gz -C split-fixtures
          mkdir -p out logs
          target/release/roundhouse --target spinel split-fixtures/real-blog -o out/blog 2>&1 | tail -1
      - name: perf
        run: |
          sudo apt-get install -yq linux-tools-common linux-tools-$(uname -r) || sudo apt-get install -yq linux-tools-azure
          sudo sysctl kernel.perf_event_paranoid=-1
          cd out/blog
          perf record -F 299 --call-graph fp -o /tmp/perf.data -- $GITHUB_WORKSPACE/sp/spinel main.rb -c -o /tmp/blogp.c --force --timing 2> $GITHUB_WORKSPACE/logs/timing.log
          perf report -i /tmp/perf.data --children --sort symbol --stdio -g none --percent-limit 0.7 2>/dev/null | grep -v '^$' | grep -v '^#' > $GITHUB_WORKSPACE/logs/perf-children.txt
          for s in const_node_class_index infer_param_types_ex local_write_ty nullable_int_value narrow_object_arrays infer_write_types infer_block_params call_target an_cls_facts an_phase_storage; do
            echo "=== $s callers" >> $GITHUB_WORKSPACE/logs/perf-callers.txt
            perf report -i /tmp/perf.data --no-children --stdio --symbols=$s -G -g caller,1,callee,function,percent --percent-limit 0 2>/dev/null | grep -v '^#' | grep -v '^$' | head -60 >> $GITHUB_WORKSPACE/logs/perf-callers.txt
            echo "=== $s callees" >> $GITHUB_WORKSPACE/logs/perf-callees.txt
            perf report -i /tmp/perf.data --children --stdio --symbols=$s -g callee,1,caller,function,percent --percent-limit 0 2>/dev/null | grep -v '^#' | grep -v '^$' | head -60 >> $GITHUB_WORKSPACE/logs/perf-callees.txt
          done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: analysis-split-5
          path: logs
