name: analysis-split
on:
  push:
    branches: [analysis-split]
permissions:
  contents: read
env:
  CAMPFIRE_SHA: c8f74a0b0e1e93146c4d7c1d6ac80c9079682216
  BRANCH: top-level-name-index
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build roundhouse (release)
        run: cargo build --release --bin roundhouse
      - name: Build Spinel master and branch
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp-base
          git -C sp-base fetch -q https://github.com/dai199/spinel "$BRANCH"
          git -C sp-base checkout -q FETCH_HEAD~1
          git clone -q sp-base sp-new && git -C sp-new fetch -q https://github.com/dai199/spinel "$BRANCH" && git -C sp-new checkout -q FETCH_HEAD
          for d in sp-base sp-new; do make -C $d deps >/dev/null && make -C $d all -j4 >/dev/null && git -C $d log -1 --oneline; done
      - name: Emit
        run: |
          tar -xzf split-fixtures/real-blog.tar.gz -C split-fixtures
          curl -fsSL "https://codeload.github.com/basecamp/once-campfire/tar.gz/${CAMPFIRE_SHA}" -o /tmp/cf.tgz
          mkdir -p split-fixtures/campfire && tar -xzf /tmp/cf.tgz -C split-fixtures/campfire --strip-components=1
          RH=target/release/roundhouse
          mkdir -p out logs
          $RH --target spinel split-fixtures/real-blog -o out/blog 2>&1 | tail -1
          $RH --target spinel split-fixtures/empty -o out/empty 2>&1 | tail -1
          $RH --target spinel split-fixtures/campfire -o out/campfire --allow-unsupported 2>&1 | tail -1
      - name: Apps, base vs branch (C identical, analysis ms)
        run: |
          for r in 1 2; do for a in blog empty campfire; do for v in sp-base sp-new; do
            [ "$a" = campfire ] && [ "$r" = 2 ] && continue
            ( cd out/$a && rbs=""; [ -d sig ] && rbs="--rbs sig"
              $GITHUB_WORKSPACE/$v/spinel main.rb $rbs -c -o /tmp/$a-$v.c --force --timing ) > logs/$a-$v-r$r.log 2>&1 || echo "$a $v FAILED"
            echo "$a $v r$r $(grep -o 'phase=analysis ms=[0-9.]*' logs/$a-$v-r$r.log) $(grep -o 'phase=codegen_program ms=[0-9.]*' logs/$a-$v-r$r.log)"
          done; cmp -s /tmp/$a-sp-base.c /tmp/$a-sp-new.c && echo "$a C identical" || echo "$a C DIFFERS"; done; done | tee logs/apps.txt
      - name: test/ corpus, base vs branch (C identical)
        run: |
          cd sp-base
          find test -name '*.rb' | sort > /tmp/tests.txt
          wc -l < /tmp/tests.txt
          cat > /tmp/one.sh <<'E'
          f="$1"; o=/tmp/corp/$(echo "$f" | tr / _)
          timeout 120 $GITHUB_WORKSPACE/sp-base/spinel "$f" -S > "$o.base" 2>&1; echo "exit=$?" >> "$o.base"
          timeout 120 $GITHUB_WORKSPACE/sp-new/spinel "$f" -S > "$o.new" 2>&1; echo "exit=$?" >> "$o.new"
          cmp -s "$o.base" "$o.new" && rm -f "$o.base" "$o.new" || echo "DIFF $f"
          E
          mkdir -p /tmp/corp
          xargs -P4 -n1 bash /tmp/one.sh < /tmp/tests.txt | tee $GITHUB_WORKSPACE/logs/corpus-diff.txt
          echo "differing: $(grep -c DIFF $GITHUB_WORKSPACE/logs/corpus-diff.txt || true)"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: analysis-split-3
          path: logs
