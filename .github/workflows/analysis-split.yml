name: analysis-split
on:
  push:
    branches: [analysis-split]
permissions:
  contents: read
env:
  CAMPFIRE_SHA: c8f74a0b0e1e93146c4d7c1d6ac80c9079682216
  BRANCH: warm-start
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build roundhouse (release)
        run: cargo build --release --bin roundhouse
      - name: Build Spinel
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp
          git -C sp fetch -q https://github.com/dai199/spinel "$BRANCH" && git -C sp checkout -q FETCH_HEAD
          make -C sp deps >/dev/null && make -C sp all -j4 COPT="-O2 -g -fno-omit-frame-pointer" >/dev/null && git -C sp log -1 --oneline
      - name: Emit
        run: |
          tar -xzf split-fixtures/real-blog.tar.gz -C split-fixtures
          mkdir -p out logs
          target/release/roundhouse --target spinel split-fixtures/real-blog -o out/blog 2>&1 | tail -1
      - name: Trace the program-wide moves
        run: |
          cd out/blog
          SP_TOUCH_TRACE=1 timeout 1200 $GITHUB_WORKSPACE/sp/spinel main.rb -c -o /tmp/blog.c --force --timing 2> /tmp/tr.log || true
          grep -A12 "touch-trace: round=1[23] " /tmp/tr.log | head -400 > $GITHUB_WORKSPACE/logs/trace-raw.txt
          bin=$(readlink -f $GITHUB_WORKSPACE/sp/spinel)
          grep -o '(+0x[0-9a-f]*)' $GITHUB_WORKSPACE/logs/trace-raw.txt | tr -d '(+)' | sort | uniq -c | sort -rn > /tmp/offs.txt || true
          while read -r n off; do echo "$n $off $(addr2line -f -i -C -e "$bin" "$off" | paste -sd' ' | cut -c1-300)"; done < /tmp/offs.txt > $GITHUB_WORKSPACE/logs/trace.txt || true
          grep -c "touch-trace" /tmp/tr.log
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: touch-trace-2
          path: logs
