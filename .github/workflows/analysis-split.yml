name: analysis-split
on:
  push:
    branches: [analysis-split]
permissions:
  contents: read
env:
  CAMPFIRE_SHA: c8f74a0b0e1e93146c4d7c1d6ac80c9079682216
  BRANCH: warm-start
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build roundhouse (release)
        run: cargo build --release --bin roundhouse
      - name: Build Spinel
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp
          git -C sp fetch -q https://github.com/dai199/spinel "$BRANCH" && git -C sp checkout -q FETCH_HEAD
          make -C sp deps >/dev/null && make -C sp all -j4 COPT="-O2 -g -fno-omit-frame-pointer" >/dev/null && git -C sp log -1 --oneline
      - name: Emit
        run: |
          tar -xzf split-fixtures/real-blog.tar.gz -C split-fixtures
          mkdir -p out logs
          target/release/roundhouse --target spinel split-fixtures/real-blog -o out/blog 2>&1 | tail -1
      - name: Rounds and perf
        run: |
          sudo apt-get install -yq linux-tools-common linux-tools-$(uname -r) || sudo apt-get install -yq linux-tools-azure
          sudo sysctl kernel.perf_event_paranoid=-1
          cd out/blog
          $GITHUB_WORKSPACE/sp/spinel main.rb -c -o /tmp/blog.c --force --timing 2> $GITHUB_WORKSPACE/logs/timing.log
          perf record -F 499 --call-graph fp -o /tmp/perf.data -- $GITHUB_WORKSPACE/sp/spinel main.rb -c -o /tmp/blogp.c --force > /dev/null 2>&1
          perf report -i /tmp/perf.data --no-children --sort symbol --stdio -g none 2>/dev/null | grep -v '^$' | grep -v '^#' | head -120 > $GITHUB_WORKSPACE/logs/perf-self.txt
          perf report -i /tmp/perf.data --children --sort symbol --stdio -g none 2>/dev/null | grep -v '^$' | grep -v '^#' | head -200 > $GITHUB_WORKSPACE/logs/perf-children.txt
          perf script -i /tmp/perf.data -F ip,sym 2>/dev/null | awk 'NF==0{ if (n) { s=st[n]; for (i=n-1;i>=1;i--) s=s ";" st[i]; c[s]++ } n=0; next } { n++; st[n]=$2 } END{ for (k in c) print c[k], k }' | gzip > $GITHUB_WORKSPACE/logs/folded.txt.gz
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: rounds-perf-2
          path: logs
