name: analysis-split
on:
  push:
    branches: [analysis-split]
permissions:
  contents: read
env:
  CAMPFIRE_SHA: c8f74a0b0e1e93146c4d7c1d6ac80c9079682216
  BRANCH: warm-start
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build roundhouse (release)
        run: cargo build --release --bin roundhouse
      - name: Build Spinel
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp
          git -C sp fetch -q https://github.com/dai199/spinel "$BRANCH" && git -C sp checkout -q FETCH_HEAD
          make -C sp deps >/dev/null && make -C sp all -j4 >/dev/null && git -C sp log -1 --oneline
      - name: Emit the apps and their edits
        run: |
          tar -xzf split-fixtures/real-blog.tar.gz -C split-fixtures
          curl -fsSL "https://codeload.github.com/basecamp/once-campfire/tar.gz/${CAMPFIRE_SHA}" -o /tmp/cf.tgz
          mkdir -p split-fixtures/campfire && tar -xzf /tmp/cf.tgz -C split-fixtures/campfire --strip-components=1
          RH=$PWD/target/release/roundhouse
          mkdir -p out logs src
          emit() { $RH --target spinel "src/$1" -o "out/$1" --allow-unsupported 2>&1 | tail -1; }
          cp -r split-fixtures/real-blog src/blog
          cp -r split-fixtures/real-blog src/blog-view && echo '<p>Warm start</p>' >> src/blog-view/app/views/articles/show.html.erb
          cp -r split-fixtures/real-blog src/blog-model && perl -0pi -e 's/\nend\s*\z/\n  def shout_title = title.to_s.upcase\nend\n/' src/blog-model/app/models/article.rb \
            && echo '<p><%= @article.shout_title %></p>' >> src/blog-model/app/views/articles/show.html.erb
          cp -r split-fixtures/campfire src/cf
          cp -r split-fixtures/campfire src/cf-view && v=$(ls src/cf-view/app/views/rooms/*.html.erb | head -1) && echo "$v" && echo '<p>Warm start</p>' >> "$v"
          for a in blog blog-view blog-model cf cf-view; do emit $a; done
          diff -r out/blog out/blog-model | head -20 || true
      - name: Cold and warm compiles
        run: |
          run() {  # app tag [env]
            local a=$1 t=$2; shift 2
            ( cd out/$a && rbs=""; [ -d sig ] && rbs="--rbs sig"
              /usr/bin/time -f "wall=%e rss=%M" env "$@" $GITHUB_WORKSPACE/sp/spinel main.rb $rbs -c -o /tmp/$t.c --force --timing ) > logs/$t.log 2>&1 || echo "$t FAILED"
            echo "$t $(grep -o 'phase=analysis ms=[0-9.]*' logs/$t.log) $(grep -o 'phase=analysis_fixpoint ms=[0-9.]* rounds=[0-9]*' logs/$t.log) $(grep -o 'seeded=.*' logs/$t.log) $(grep -o 'wall=.*' logs/$t.log)"
          }
          same() { cmp -s /tmp/$1.c /tmp/$2.c && echo "C $1 == $2" || echo "C $1 != $2 ($(diff /tmp/$1.c /tmp/$2.c | grep -c '^[<>]') lines)"; }
          {
          run blog blog-cold SP_WARM_SAVE=/tmp/w-blog.txt
          run blog blog-warm SP_WARM_LOAD=/tmp/w-blog.txt; same blog-cold blog-warm
          run blog-view blog-view-cold
          run blog-view blog-view-warm SP_WARM_LOAD=/tmp/w-blog.txt; same blog-view-cold blog-view-warm
          run blog-model blog-model-cold
          run blog-model blog-model-warm SP_WARM_LOAD=/tmp/w-blog.txt; same blog-model-cold blog-model-warm
          run cf cf-cold SP_WARM_SAVE=/tmp/w-cf.txt
          run cf cf-warm SP_WARM_LOAD=/tmp/w-cf.txt; same cf-cold cf-warm
          run cf-view cf-view-cold
          run cf-view cf-view-warm SP_WARM_LOAD=/tmp/w-cf.txt; same cf-view-cold cf-view-warm
          } | tee logs/summary.txt
          cp /tmp/w-blog.txt /tmp/w-cf.txt logs/ || true
          for p in blog-cold:blog-warm blog-view-cold:blog-view-warm blog-model-cold:blog-model-warm cf-cold:cf-warm cf-view-cold:cf-view-warm; do
            diff /tmp/${p%%:*}.c /tmp/${p##*:}.c | head -200 > logs/diff-${p%%:*}.txt || true; done
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: warm-start-1
          path: logs
