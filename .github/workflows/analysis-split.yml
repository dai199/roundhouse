name: analysis-split
on:
  push:
    branches: [analysis-split]
permissions:
  contents: read
env:
  CAMPFIRE_SHA: c8f74a0b0e1e93146c4d7c1d6ac80c9079682216
  BRANCHES: oa-final-grace
jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-rust
      - name: Build roundhouse (release)
        run: cargo build --release --bin roundhouse
      - name: Clone Spinel
        run: |
          sudo apt-get update -q && sudo apt-get install -yq libsqlite3-dev libyaml-dev
          git clone -q https://github.com/matz/spinel sp
          for br in $BRANCHES; do git -C sp fetch -q https://github.com/dai199/spinel "$br:$br"; done
          git -C sp merge-base --octopus HEAD $BRANCHES > /tmp/base.sha; cat /tmp/base.sha
          find sp/test -name '*.rb' | sed 's|^sp/||' | sort > /tmp/tests.txt
      - name: Emit
        run: |
          tar -xzf split-fixtures/real-blog.tar.gz -C split-fixtures
          mkdir -p out logs
          target/release/roundhouse --target spinel split-fixtures/real-blog -o out/blog 2>&1 | tail -1
          target/release/roundhouse --target spinel split-fixtures/empty -o out/empty 2>&1 | tail -1
      - name: Each branch at the same path
        run: |
          cat > /tmp/one.sh <<'X'
          f="$1"; o=/tmp/corp/$V/$(echo "$f" | tr / _)
          cd $GITHUB_WORKSPACE/sp && timeout 120 ./spinel "$f" -S > "$o" 2>&1; echo "exit=$?" >> "$o"
          X
          for V in base $BRANCHES; do
            if [ $V = base ]; then git -C sp checkout -q $(cat /tmp/base.sha); else git -C sp checkout -q $V; fi
            make -C sp deps >/dev/null && make -C sp all -j4 >/dev/null && git -C sp log -1 --oneline
            for a in blog empty; do
              ( cd out/$a && $GITHUB_WORKSPACE/sp/spinel main.rb -c -o /tmp/$a-$V.c --force --timing ) > logs/$a-$V.log 2>&1 || echo "$a $V FAILED"
              echo "$a $V $(grep -o 'phase=analysis ms=[0-9.]*' logs/$a-$V.log) $(grep -o 'phase=analysis_fixpoint ms=[0-9.]* rounds=[0-9]*' logs/$a-$V.log) $(grep -o 'phase=codegen_program ms=[0-9.]*' logs/$a-$V.log)"
            done
            mkdir -p /tmp/corp/$V
            export V; xargs -P4 -n1 bash /tmp/one.sh < /tmp/tests.txt
          done | tee logs/apps.txt
          for V in $BRANCHES; do
            for a in blog empty; do cmp -s /tmp/$a-base.c /tmp/$a-$V.c && echo "$V $a C identical" || echo "$V $a C DIFFERS"; done
            echo "$V corpus: $(wc -l < /tmp/tests.txt) files, $(diff -rq /tmp/corp/base /tmp/corp/$V | wc -l) differ"
            diff -rq /tmp/corp/base /tmp/corp/$V | head -50 > logs/corpus-diff-$V.txt || true
          done | tee -a logs/apps.txt
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: speed-cmp-3
          path: logs
